<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">YouTube thumbnail preview</title>
  <desc id="desc">High contrast YouTube thumbnail design preview.</desc>
  <defs>
